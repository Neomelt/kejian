name: kejian
description: 一款本地优先、无广告的移动端课程表。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  csv: ^7.2.0
  excel: ^4.0.6
  file_picker: ^10.3.3
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_android: 2.2.23
  sqflite: ^2.4.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
